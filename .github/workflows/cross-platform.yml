# D2B-193: verifies a real (non-mocked) Playwright browser launch on
# every supported OS/arch/browser-type combination this skill claims to
# support. Every existing t/*.t test injects a mock playwright_factory,
# so this is the only place a genuine browser launch is ever exercised.
#
# os covers amd64+arm64 for Linux and macOS via distinct GitHub-hosted
# runner labels (arch is baked into the label, not a separate matrix
# dimension): ubuntu-latest (amd64), ubuntu-24.04-arm (arm64),
# macos-latest (arm64, Apple Silicon by default), macos-13 (amd64,
# Intel).
#
# D2B-203: windows-latest is excluded entirely. D2B-202 fixed its
# Clone.xs ABI mismatch (distribution: strawberry, still present below
# for when Windows is restored), but that exposed a second, deeper
# issue: the CPAN Playwright module's own Windows support is
# documented upstream as an experimental, separate implementation
# (teodesian/playwright-perl#22, open) that spawns its Node driver via
# a single-string 'start /MIN ...' + netstat-polling with no real error
# capture, and it fails to spawn at all in this environment for every
# browser identically. That is a genuine upstream limitation, not
# something to patch by vendoring a fix to someone else's CPAN module
# inside this skill's own repo.
#
# browser is chrome/chromium/edge/firefox/webkit (D2B-200: edge added
# now that D2B-192 shipped --browser edge support). ubuntu-24.04-arm is
# excluded from the edge combination specifically - unlike chrome (which
# just needed installing under the "chromium" name instead, see below),
# Microsoft ships no Edge build for Linux ARM64 at all, so there is no
# substitute that would actually exercise edge on that platform.
name: Cross-platform browser launch

on:
  push:
  pull_request:

jobs:
  real-launch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13]
        browser: [chrome, chromium, edge, firefox, webkit]
        exclude:
          - os: ubuntu-24.04-arm
            browser: edge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
          # D2B-202: live-verified across 3 real runs that this action's
          # default Windows Perl 5.40 artifact fails to compile/load XS
          # extensions correctly ("Clone.c: loadable library and perl
          # binaries are mismatched") - a known, open, unresolved bug
          # (shogo82148/actions-setup-perl#2310; the issue itself does
          # not carry a maintainer-confirmed root cause, only the same
          # symptom reported across several Perl versions). distribution:
          # strawberry installs actual Strawberry Perl instead, which
          # avoids the bug. This is a Windows-only input - the action's
          # own docs confirm it falls back to the default distribution
          # on every other platform, so this line is unconditional.
          distribution: strawberry

      - name: Install Perl dependencies
        # D2B-202: 'perl -S cpanm' (rather than bare 'cpanm') forces
        # cpanm to run under this exact invoking perl instead of
        # trusting its own resolved shebang - a reasonable defensive
        # practice, though live-verified NOT to be the actual fix for
        # the Windows Clone.xs failure by itself (see the
        # distribution: strawberry line above for the real fix).
        run: perl -S cpanm --quiet --notest --installdeps .

      - name: Install Node dependencies (pins the exact Playwright version from package.json)
        run: npm install

      - name: Install Playwright's ${{ matrix.browser }} browser binary
        shell: bash
        run: |
          # D2B-199: Playwright's own installer refuses the branded
          # "chrome" channel entirely on Linux ARM64 ("not supported on
          # Linux Arm64") - install "chromium" instead there. This
          # skill's own 'chrome' browser type has no executablePath set
          # on a fresh runner (no system Chrome/Chromium binary exists
          # to find), so it already launches Playwright's bundled
          # chromium build either way - installing under a different
          # name changes nothing this test actually exercises.
          # D2B-200: Playwright's install CLI names the Edge channel
          # "msedge", not "edge" - this skill's own --browser value is
          # "edge" (matching BrowserPath.pm's channel=>'msedge' launch
          # option), but the install target name is Playwright's own,
          # not this skill's.
          if [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ] && [ "${{ matrix.browser }}" = "chrome" ]; then
            npx playwright install --with-deps chromium
          elif [ "${{ matrix.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi

      - name: Compute a portable file:// URL for the static fixture (Windows needs file:///C:/... not file://C:\...)
        id: fixture
        run: node -e "console.log('url=' + require('url').pathToFileURL(require('path').resolve('t/fixtures/static-page.html')).href)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Real browser launch (not mocked) - invokes cli/get directly, not the dashboard wrapper (Developer Dashboard is not installed on a fresh runner)
        run: perl -Ilib cli/get "${{ steps.fixture.outputs.url }}" --browser ${{ matrix.browser }}
